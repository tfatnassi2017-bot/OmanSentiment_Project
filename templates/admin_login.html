{% extends "base.html" %}
{% block title %}لوحة الباحث - تسجيل الدخول{% endblock %}
{% block h1 %}لوحة الباحث{% endblock %}
{% block sub %}تسجيل دخول مخصص للباحث فقط.{% endblock %}

{% block extra_head %}
<style>
  form{ display:flex; flex-direction:column; gap:12px; }
  input[type=password]{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:15px; font-family:'Tajawal',sans-serif; direction:ltr; text-align:left;
  }
  input[type=password]:focus{ outline:2px solid var(--teal-mid); border-color:var(--teal-mid); }
  button{
    background:var(--teal-deep); color:#fff; border:none; padding:12px; border-radius:10px;
    font-size:15px; font-weight:800; cursor:pointer;
  }
  button:hover{ background:var(--teal-mid); }
  .error{ color:var(--neg); font-size:13px; text-align:center; font-weight:700; }
</style>
{% endblock %}

{% block content %}
<div class="card">
  <form method="POST">
    <input type="password" name="password" placeholder="كلمة المرور" autofocus required>
    <button type="submit">دخول</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
{% endblock %}
